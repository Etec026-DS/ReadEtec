<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadEtec - Entrar</title>
  <link rel="stylesheet" href="css/style.css">

  <script src="js/tema-inicial.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/sessao.js"></script>
  <!-- Se já estiver logado, vai direto para a sua área -->
  <script>irParaAreaDoUsuario();</script>
</head>
<body class="pagina-login">

  <button id="botao-tema" class="tema-flutuante" title="Alternar tema claro/escuro">🌙</button>

  <main class="caixa-login">
    <h1>📚 ReadEtec</h1>
    <p class="subtitulo">Biblioteca da Etec</p>

    <!-- ============ ENTRAR ============ -->
    <div id="painel-entrar" class="cartao">
      <h2>Entrar</h2>
      <form id="form-entrar">
        <label>E-mail (ou "admin")
          <input type="text" id="entrar-usuario" autocomplete="username" required>
        </label>
        <label>Senha
          <input type="password" id="entrar-senha" autocomplete="current-password" required>
        </label>

        <p id="entrar-erro" class="mensagem erro" hidden></p>

        <button type="submit" class="largo">Entrar</button>
      </form>
      <p class="alternar">
        Ainda não tem conta? <a href="#" id="link-criar">Criar conta</a>
      </p>
    </div>

    <!-- ============ CRIAR CONTA (leitor) ============ -->
    <div id="painel-criar" class="cartao" hidden>
      <h2>Criar conta de leitor</h2>
      <form id="form-criar">
        <label>Nome completo *
          <input type="text" id="criar-nome" autocomplete="name" required>
        </label>
        <label>Turma ou função
          <input type="text" id="criar-turma" placeholder="Ex.: 2º DS, Professor">
        </label>
        <label>E-mail *
          <input type="email" id="criar-email" autocomplete="email" required>
        </label>
        <label>Telefone
          <input type="tel" id="criar-tel" autocomplete="tel" placeholder="(11) 99999-9999">
        </label>
        <label>Senha * (mínimo 6 caracteres)
          <input type="password" id="criar-senha" autocomplete="new-password" minlength="6" required>
        </label>
        <label>Confirmar senha *
          <input type="password" id="criar-confirmar" autocomplete="new-password" minlength="6" required>
        </label>

        <p class="dica">Você poderá adicionar outro e-mail, outro telefone e suas
          preferências de leitura depois, em "Meu perfil".</p>

        <p id="criar-erro" class="mensagem erro" hidden></p>

        <button type="submit" class="largo">Criar conta</button>
      </form>
      <p class="alternar">
        Já tem conta? <a href="#" id="link-entrar">Entrar</a>
      </p>
    </div>

    <p class="aviso-seguranca">⚠️ Projeto escolar: não use uma senha que você usa em outros sites.</p>
  </main>

  <script src="js/tema.js"></script>
  <script src="js/mostrar-senha.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
